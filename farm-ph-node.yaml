# farm-ph-node.yaml
# FireBeetle 2 ESP32-E + Gravity IO Shield + ADS1115 + pH Meter V2 + EC Meter V2 + DS18B20
#   Shieldets I2C-port -> SDA GPIO21, SCL GPIO22
#   Shieldets D2-port  -> GPIO25
#   pH-printet sidder i ADS1115'ens A0-port
#   EC-printet sidder i ADS1115'ens A1-port

esphome:
  name: farm-ph-node
  # Alle pumper skal være slukket ved boot — en kørsel må aldrig genoptages
  # efter en reboot (pump_active/run_secs er restore_value: no).
  on_boot:
    priority: -100
    then:
      - servo.write: { id: servo_1, level: 0% }
      - servo.write: { id: servo_2, level: 0% }
      - servo.write: { id: servo_3, level: 0% }
      - servo.write: { id: servo_4, level: 0% }
      - lambda: "id(pump_active) = 0;"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Farm pH Fallback"
    password: !secret ap_password

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  topic_prefix: farm/ph_node
  reboot_timeout: 0s
  on_connect:
    # Genskab den retained pumpetilstand efter boot/reconnect: alt er slukket.
    - mqtt.publish: { topic: farm/pump/1/state, payload: "off", retain: true }
    - mqtt.publish: { topic: farm/pump/2/state, payload: "off", retain: true }
    - mqtt.publish: { topic: farm/pump/3/state, payload: "off", retain: true }
    - mqtt.publish: { topic: farm/pump/4/state, payload: "off", retain: true }
  on_message:
    # Payload = varighed i sekunder som tal. Kør den navngivne pumpe fremad i
    # varigheden og stop så. Afvis (og log warning), hvis en anden pumpe kører,
    # eller varigheden er uden for 0,5–30 s. Kun én pumpe ad gangen pga. den
    # delte 6 V/2 A-forsyning.
    - topic: farm/pump/1/run
      then:
        - lambda: |-
            float secs = atof(x.c_str());
            if (id(pump_active) != 0) {
              ESP_LOGW("pump", "pumpe 1 afvist: pumpe %d koerer allerede", id(pump_active));
              return;
            }
            if (secs < 0.5f || secs > 30.0f) {
              ESP_LOGW("pump", "pumpe 1 afvist: ugyldig varighed %.2f s (0.5-30)", secs);
              return;
            }
            id(run_secs) = secs;
            id(pump_active) = 1;
            id(run_pump_1).execute();
    - topic: farm/pump/2/run
      then:
        - lambda: |-
            float secs = atof(x.c_str());
            if (id(pump_active) != 0) {
              ESP_LOGW("pump", "pumpe 2 afvist: pumpe %d koerer allerede", id(pump_active));
              return;
            }
            if (secs < 0.5f || secs > 30.0f) {
              ESP_LOGW("pump", "pumpe 2 afvist: ugyldig varighed %.2f s (0.5-30)", secs);
              return;
            }
            id(run_secs) = secs;
            id(pump_active) = 2;
            id(run_pump_2).execute();
    - topic: farm/pump/3/run
      then:
        - lambda: |-
            float secs = atof(x.c_str());
            if (id(pump_active) != 0) {
              ESP_LOGW("pump", "pumpe 3 afvist: pumpe %d koerer allerede", id(pump_active));
              return;
            }
            if (secs < 0.5f || secs > 30.0f) {
              ESP_LOGW("pump", "pumpe 3 afvist: ugyldig varighed %.2f s (0.5-30)", secs);
              return;
            }
            id(run_secs) = secs;
            id(pump_active) = 3;
            id(run_pump_3).execute();
    - topic: farm/pump/4/run
      then:
        - lambda: |-
            float secs = atof(x.c_str());
            if (id(pump_active) != 0) {
              ESP_LOGW("pump", "pumpe 4 afvist: pumpe %d koerer allerede", id(pump_active));
              return;
            }
            if (secs < 0.5f || secs > 30.0f) {
              ESP_LOGW("pump", "pumpe 4 afvist: ugyldig varighed %.2f s (0.5-30)", secs);
              return;
            }
            id(run_secs) = secs;
            id(pump_active) = 4;
            id(run_pump_4).execute();
    # Nødstop: sluk alle pumper straks — også midt i en kørsel. script.stop
    # afbryder den kørende timer, så den pre-empter en igangværende kørsel.
    - topic: farm/pump/stop_all
      then:
        - script.stop: run_pump_1
        - script.stop: run_pump_2
        - script.stop: run_pump_3
        - script.stop: run_pump_4
        - servo.write: { id: servo_1, level: 0% }
        - servo.write: { id: servo_2, level: 0% }
        - servo.write: { id: servo_3, level: 0% }
        - servo.write: { id: servo_4, level: 0% }
        - mqtt.publish: { topic: farm/pump/1/state, payload: "off", retain: true }
        - mqtt.publish: { topic: farm/pump/2/state, payload: "off", retain: true }
        - mqtt.publish: { topic: farm/pump/3/state, payload: "off", retain: true }
        - mqtt.publish: { topic: farm/pump/4/state, payload: "off", retain: true }
        - lambda: |-
            id(pump_active) = 0;
            ESP_LOGW("pump", "NOEDSTOP: alle pumper stoppet (farm/pump/stop_all)");

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

ads1115:
  - address: 0x48
    id: ads

one_wire:
  - platform: gpio
    pin: GPIO25

globals:
  - id: cal_v4
    type: float
    restore_value: true
    initial_value: '1.320'
  - id: cal_v7
    type: float
    restore_value: true
    initial_value: '1.500'
  - id: ec_k
    type: float
    restore_value: true
    initial_value: '1.000'
  - id: pump_active
    type: int
    restore_value: no
    initial_value: '0'
  - id: run_secs
    type: float
    restore_value: no
    initial_value: '0'

# --- Pumper: PWM-udgange (ledc @ 50 Hz) og servoer (5 % / 7,5 % / 10 %) ---
#   pumpe 1  pH-down      D7   GPIO13
#   pumpe 2  gødning A    D10  GPIO17
#   pumpe 3  gødning B    D11  GPIO16
#   pumpe 4  gødning C    D12  GPIO4
output:
  - platform: ledc
    id: pwm_1
    pin: GPIO13
    frequency: 50 Hz
  - platform: ledc
    id: pwm_2
    pin: GPIO17
    frequency: 50 Hz
  - platform: ledc
    id: pwm_3
    pin: GPIO16
    frequency: 50 Hz
  - platform: ledc
    id: pwm_4
    pin: GPIO4
    frequency: 50 Hz

servo:
  - id: servo_1
    output: pwm_1
    min_level: 5%
    idle_level: 7.5%
    max_level: 10%
    auto_detach_time: 0s
  - id: servo_2
    output: pwm_2
    min_level: 5%
    idle_level: 7.5%
    max_level: 10%
    auto_detach_time: 0s
  - id: servo_3
    output: pwm_3
    min_level: 5%
    idle_level: 7.5%
    max_level: 10%
    auto_detach_time: 0s
  - id: servo_4
    output: pwm_4
    min_level: 5%
    idle_level: 7.5%
    max_level: 10%
    auto_detach_time: 0s

sensor:
  - platform: ads1115
    ads1115_id: ads
    multiplexer: 'A0_GND'
    gain: 4.096
    id: ph_voltage
    name: "ph_voltage"
    accuracy_decimals: 4
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads
    multiplexer: 'A1_GND'
    gain: 4.096
    id: ec_voltage
    name: "ec_voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 4
    update_interval: 5s
    filters:
      - median:
          window_size: 5
          send_every: 1

  - platform: dallas_temp
    id: water_temp
    name: "water_temperature"
    update_interval: 30s
    filters:
      - filter_out: nan

  - platform: template
    name: "ph"
    id: ph_value
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      float v = id(ph_voltage).state;
      float v4 = id(cal_v4);
      float v7 = id(cal_v7);
      if (isnan(v) || v7 == v4) return NAN;
      float ph = 4.0 + (v - v4) * (7.0 - 4.0) / (v7 - v4);
      float t = id(water_temp).state;
      if (!isnan(t)) {
        ph = 7.0 + (ph - 7.0) * (298.15f / (273.15f + t));
      }
      return ph;
    filters:
      - median:
          window_size: 5
          send_every: 1

  - platform: template
    name: "ec"
    id: ec_value
    unit_of_measurement: "mS/cm"
    accuracy_decimals: 3
    update_interval: 15s
    lambda: |-
      float v = id(ec_voltage).state;
      float t = id(water_temp).state;
      if (isnan(v) || isnan(t)) return NAN;
      float raw = (v * 1000.0f) / 164.0f;
      return raw * id(ec_k) / (1.0f + 0.0185f * (t - 25.0f));

# --- Pumpernes kørselsscripts: fremad (100 %) i run_secs, så stop (tomgang). ---
# Ét script pr. pumpe, så nødstoppet kan stoppe præcis den kørende timer.
script:
  - id: run_pump_1
    mode: single
    then:
      - mqtt.publish: { topic: farm/pump/1/state, payload: "on", retain: true }
      - servo.write: { id: servo_1, level: 100% }
      - delay: !lambda "return (uint32_t)(id(run_secs) * 1000.0f);"
      - servo.write: { id: servo_1, level: 0% }
      - mqtt.publish: { topic: farm/pump/1/state, payload: "off", retain: true }
      - lambda: "id(pump_active) = 0;"
  - id: run_pump_2
    mode: single
    then:
      - mqtt.publish: { topic: farm/pump/2/state, payload: "on", retain: true }
      - servo.write: { id: servo_2, level: 100% }
      - delay: !lambda "return (uint32_t)(id(run_secs) * 1000.0f);"
      - servo.write: { id: servo_2, level: 0% }
      - mqtt.publish: { topic: farm/pump/2/state, payload: "off", retain: true }
      - lambda: "id(pump_active) = 0;"
  - id: run_pump_3
    mode: single
    then:
      - mqtt.publish: { topic: farm/pump/3/state, payload: "on", retain: true }
      - servo.write: { id: servo_3, level: 100% }
      - delay: !lambda "return (uint32_t)(id(run_secs) * 1000.0f);"
      - servo.write: { id: servo_3, level: 0% }
      - mqtt.publish: { topic: farm/pump/3/state, payload: "off", retain: true }
      - lambda: "id(pump_active) = 0;"
  - id: run_pump_4
    mode: single
    then:
      - mqtt.publish: { topic: farm/pump/4/state, payload: "on", retain: true }
      - servo.write: { id: servo_4, level: 100% }
      - delay: !lambda "return (uint32_t)(id(run_secs) * 1000.0f);"
      - servo.write: { id: servo_4, level: 0% }
      - mqtt.publish: { topic: farm/pump/4/state, payload: "off", retain: true }
      - lambda: "id(pump_active) = 0;"

button:
  - platform: template
    name: "Kalibrer pH 7"
    on_press:
      - lambda: 'id(cal_v7) = id(ph_voltage).state;'

  - platform: template
    name: "Kalibrer pH 4"
    on_press:
      - lambda: 'id(cal_v4) = id(ph_voltage).state;'

  - platform: template
    name: "Kalibrer EC 1413"
    on_press:
      - lambda: |-
          float v = id(ec_voltage).state;
          float t = id(water_temp).state;
          if (isnan(v) || isnan(t)) return;
          float raw = (v * 1000.0f) / 164.0f;
          float comp = raw / (1.0f + 0.0185f * (t - 25.0f));
          if (comp > 0.01f) id(ec_k) = 1.413f / comp;

  - platform: template
    name: "Kalibrer EC 12.88"
    on_press:
      - lambda: |-
          float v = id(ec_voltage).state;
          float t = id(water_temp).state;
          if (isnan(v) || isnan(t)) return;
          float raw = (v * 1000.0f) / 164.0f;
          float comp = raw / (1.0f + 0.0185f * (t - 25.0f));
          if (comp > 0.01f) id(ec_k) = 12.88f / comp;

  - platform: template
    name: "Kalibrer pumpe 1 - pH-down (10 s)"
    on_press:
      - lambda: |-
          if (id(pump_active) != 0) {
            ESP_LOGW("pump", "kalibrering pumpe 1 afvist: pumpe %d koerer", id(pump_active));
            return;
          }
          id(run_secs) = 10.0f;
          id(pump_active) = 1;
          id(run_pump_1).execute();

  - platform: template
    name: "Kalibrer pumpe 2 - gødning A (10 s)"
    on_press:
      - lambda: |-
          if (id(pump_active) != 0) {
            ESP_LOGW("pump", "kalibrering pumpe 2 afvist: pumpe %d koerer", id(pump_active));
            return;
          }
          id(run_secs) = 10.0f;
          id(pump_active) = 2;
          id(run_pump_2).execute();

  - platform: template
    name: "Kalibrer pumpe 3 - gødning B (10 s)"
    on_press:
      - lambda: |-
          if (id(pump_active) != 0) {
            ESP_LOGW("pump", "kalibrering pumpe 3 afvist: pumpe %d koerer", id(pump_active));
            return;
          }
          id(run_secs) = 10.0f;
          id(pump_active) = 3;
          id(run_pump_3).execute();

  - platform: template
    name: "Kalibrer pumpe 4 - gødning C (10 s)"
    on_press:
      - lambda: |-
          if (id(pump_active) != 0) {
            ESP_LOGW("pump", "kalibrering pumpe 4 afvist: pumpe %d koerer", id(pump_active));
            return;
          }
          id(run_secs) = 10.0f;
          id(pump_active) = 4;
          id(run_pump_4).execute();
